# Root defaults. Values marked [VERSIONED] are set per node in versions/<node>/gradle.properties.

org.gradle.jvmargs=-Xmx3G -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod identity
mod.id=stackabletrims
mod.name=Stackable Trims
mod.group=com.golem
mod.version=3.0.0
# Jar base name: <archives>-<loader>-<mod.version>+<minecraft>.jar
mod.archives=stackable-armor-trims
mod.author=Golem
mod.license=GPL-3.0
mod.description=Allows you to stack as many trims as you want!
mod.homepage=https://modrinth.com/mod/stackable-trims
mod.sources=https://github.com/Bruv-Network/Stackable-Trims
mod.issues=https://github.com/Bruv-Network/Stackable-Trims/issues

# [VERSIONED] Per-node values
deps.minecraft=[VERSIONED]
# fabric.mod.json syntax on Fabric nodes, Maven range syntax on (Neo)Forge nodes.
deps.minecraft_range=[VERSIONED]
java_version=[VERSIONED]

# Fabric Loom version, applied to whichever variant loom-back-compat selects for the node.
loomx.loom_version=1.16.3
deps.fabric_loader=0.19.5
# The oldest Fabric Loader the jar accepts (fabric.mod.json); MixinExtras ships with Loader since 0.15.
deps.fabric_loader_floor=0.15.0

# Release upload (gradle/publish.gradle.kts documents every key). A blank project id skips that site. Tokens come
# from MODRINTH_TOKEN / CURSEFORGE_TOKEN or ~/.gradle/gradle.properties, never from this file.
golem.build.publish.modrinthProject=gRn99EsZ
golem.build.publish.curseforgeProject=876181
golem.build.publish.fabricRequires=fabric-api
