plugins {
	id 'com.gradleup.shadow'
}

architectury {
	platformSetupLoomIde()
	fabric()
}


configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

dependencies {
	modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
	modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

	common(project(path: ':common', configuration: 'namedElements')) { transitive false }
	shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand version: project.version
	}
}

jar {
	archiveClassifier = "dev"
}

shadowJar {
	dependsOn(jar)
	mainSpec.sourcePaths.clear()
	from(zipTree(jar.archiveFile))
	configurations = [project.configurations.shadowBundle]
	archiveClassifier = "dev-shadow"
}

remapJar {
	inputFile.set shadowJar.archiveFile
	dependsOn shadowJar
}
// Fabric client game tests: `./gradlew :fabric:runClientGameTest` launches the client, creates a
// flat world, spawns armor stands with stacked trims, takes screenshots into
// fabric/build/run/clientGameTest/screenshots and asserts the stacked trims are actually drawn.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'stackabletrims-gametest'
		enableGameTests = false
		eula = true
	}
}
